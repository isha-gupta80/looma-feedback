
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Looma Device Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #001540;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      background-color: #002a5c;
      padding: 1rem 2rem;
      text-align: center;
      border-bottom: 3px solid #003875;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .header-logo {
      width: 50px;
      height: 50px;
    }

    h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 600;
      color: #ffffff;
    }

    .nav-link {
      position: absolute;
      top: 1rem;
      right: 2rem;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border: 1px solid white;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .nav-link:hover {
      background-color: #003875;
    }

    #map {
      height: calc(100vh - 120px);
      width: 100%;
      border: none;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .header {
        padding: 1rem;
      }

      .header-content {
        flex-direction: column;
      }

      h2 {
        font-size: 1.5rem;
      }

      .header-logo {
        width: 40px;
        height: 40px;
      }

      .nav-link {
        position: static;
        margin-top: 1rem;
        display: inline-block;
      }

      #map {
        height: calc(100vh - 160px);
      }
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 1.3rem;
      }

      .nav-link {
        font-size: 0.9rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="{{ url_for('dashboard') }}" class="nav-link">Back to Dashboard</a>
    <div class="header-content">
      <img src="{{ url_for('static', filename='Looma-2019.png') }}" alt="Looma Logo" class="header-logo">
      <h2>Looma Device Locations</h2>
    </div>
  </div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Device data passed from backend
    const devices = JSON.parse('{{ devices | tojson | safe }}');

    // Initialize the map centered on Nepal
    const map = L.map('map').setView([28.3949, 84.1240], 7);

    // Add OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);

    // Function to get address from coordinates using reverse geocoding
    async function getAddressFromCoords(lat, lng) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`);
        const data = await response.json();
        
        if (data && data.display_name) {
          return data.display_name;
        } else {
          return 'Address not found';
        }
      } catch (error) {
        console.error('Error fetching address:', error);
        return 'Unable to fetch address';
      }
    }

    // Validate device coordinates and filter invalid ones
    const validDevices = devices.filter(device => {
      const lat = parseFloat(device.latitude);
      const lng = parseFloat(device.longitude);
      return !isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
    });

    console.log(`Displaying ${validDevices.length} valid devices out of ${devices.length} total devices`);

    // Auto-fit map bounds if devices exist
    if (validDevices.length > 0) {
      const group = new L.featureGroup();
      validDevices.forEach(device => {
        group.addLayer(L.marker([device.latitude, device.longitude]));
      });
      map.fitBounds(group.getBounds().pad(0.1));
    }

    // Add markers for each device with address lookup
    validDevices.forEach(async device => {
      const marker = L.marker([device.latitude, device.longitude]).addTo(map);
      
      // Initial popup content with coordinates
      const initialPopupContent = `
        <div style="min-width: 250px;">
          <h4 style="margin: 0 0 10px 0; color: #002a5c;"><b>Serial: ${device.serial}</b></h4>
          <p style="margin: 5px 0;"><strong>School:</strong> ${device.school}</p>
          <p style="margin: 5px 0;"><strong>Technician:</strong> ${device.technician}</p>
          <p style="margin: 5px 0;"><strong>Condition:</strong> ${device.condition}</p>
          <p style="margin: 5px 0;"><strong>Last Scan:</strong> ${new Date(device.timestamp).toLocaleDateString()}</p>
          <p style="margin: 5px 0;"><strong>Coordinates:</strong> ${device.latitude.toFixed(6)}, ${device.longitude.toFixed(6)}</p>
          <p style="margin: 5px 0; color: #666;"><strong>Address:</strong> Loading...</p>
        </div>
      `;
      
      marker.bindPopup(initialPopupContent);
      
      // Fetch address and update popup
      try {
        const address = await getAddressFromCoords(device.latitude, device.longitude);
        const updatedPopupContent = `
          <div style="min-width: 250px;">
            <h4 style="margin: 0 0 10px 0; color: #002a5c;"><b>Serial: ${device.serial}</b></h4>
            <p style="margin: 5px 0;"><strong>School:</strong> ${device.school}</p>
            <p style="margin: 5px 0;"><strong>Technician:</strong> ${device.technician}</p>
            <p style="margin: 5px 0;"><strong>Condition:</strong> ${device.condition}</p>
            <p style="margin: 5px 0;"><strong>Last Scan:</strong> ${new Date(device.timestamp).toLocaleDateString()}</p>
            <p style="margin: 5px 0;"><strong>Coordinates:</strong> ${device.latitude.toFixed(6)}, ${device.longitude.toFixed(6)}</p>
            <p style="margin: 5px 0; font-size: 0.9em;"><strong>Address:</strong> ${address}</p>
          </div>
        `;
        marker.setPopupContent(updatedPopupContent);
      } catch (error) {
        console.error('Error updating popup with address:', error);
      }
    });
  </script>
</body>
</html>
